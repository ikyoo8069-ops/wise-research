<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슬기로운 연구생활</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            max-height: 900px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 모바일 반응형 */
        @media (max-width: 600px) {
            .app-container {
                max-width: 100%;
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
        }

        /* 헤더 */
        .header {
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
            padding: 20px;
            text-align: center;
            color: white;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .n2b-badge {
            display: inline-block;
            background: rgba(255,255,255,0.25);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            margin-top: 8px;
            font-weight: 500;
        }

        /* 채팅 영역 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .chat-area .message:first-child {
            margin-top: 20px;
        }

        .message {
            display: flex;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 14px;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* N2B 분석 박스 */
        .n2b-analysis {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            border-left: 4px solid #71b280;
            padding: 16px;
            margin: 12px 0;
            border-radius: 0 12px 12px 0;
        }

        .n2b-item {
            margin-bottom: 12px;
        }

        .n2b-item:last-child {
            margin-bottom: 0;
        }

        .n2b-label {
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .n2b-label.not { color: #e74c3c; }
        .n2b-label.but { color: #3498db; }
        .n2b-label.because { color: #27ae60; }

        .n2b-content {
            font-size: 14px;
            color: #555;
        }

        /* 제안 박스 */
        .suggestion-box {
            background: linear-gradient(135deg, #fff9e6 0%, #fff3cd 100%);
            border-radius: 12px;
            padding: 14px;
            margin-top: 12px;
        }

        .suggestion-title {
            font-weight: 700;
            font-size: 13px;
            color: #856404;
            margin-bottom: 8px;
        }

        .suggestion-content {
            font-size: 14px;
            color: #665200;
        }

        .next-action {
            margin-top: 12px;
            padding: 10px 14px;
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
            border-radius: 8px;
            font-size: 14px;
            color: white;
            font-weight: 500;
        }

        /* 더 깊이 분석하기 버튼 */
        .deep-dive-btn {
            width: 100%;
            margin-top: 14px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .deep-dive-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(113, 178, 128, 0.4);
        }

        .deep-dive-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .depth-indicator {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 8px;
        }

        /* 본질 도달 박스 */
        .core-reached {
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
            border-radius: 12px;
            padding: 16px;
            margin-top: 14px;
            text-align: center;
            color: white;
        }

        .core-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .core-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .core-need {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .core-message {
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.5;
        }

        .new-topic-btn {
            width: 100%;
            margin-top: 14px;
            padding: 12px 16px;
            background: white;
            border: none;
            border-radius: 10px;
            color: #134e5e;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .new-topic-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* 파일 첨부 */
        .attach-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: #f0f0f0;
            color: #666;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .attach-btn:hover {
            background: #71b280;
            color: white;
        }

        .file-input {
            display: none;
        }

        .attached-file {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #e8f5e9;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #2e7d32;
        }

        .attached-file .remove-file {
            cursor: pointer;
            color: #999;
            font-size: 16px;
        }

        .attached-file .remove-file:hover {
            color: #e74c3c;
        }

        /* 로딩 */
        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 14px 18px;
            background: white;
            border-radius: 20px;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #71b280;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* 빠른 선택 */
        .quick-topics {
            padding: 12px 20px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        .quick-topics-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
        }

        .quick-topics-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .quick-topic {
            padding: 8px 14px;
            background: #e8f5e9;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            color: #134e5e;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .quick-topic:hover {
            background: #71b280;
            color: white;
        }

        /* 입력 영역 */
        .input-area {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #eee;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-field {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e9ecef;
            border-radius: 24px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #71b280;
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(113, 178, 128, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* API 키 설정 */
        .api-setup {
            padding: 20px;
            background: #f8f9fa;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .api-setup h2 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #333;
        }

        .api-setup p {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        .api-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 12px;
        }

        .api-input:focus {
            outline: none;
            border-color: #71b280;
        }

        .api-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .api-btn:hover {
            opacity: 0.9;
        }

        .demo-mode-btn {
            margin-top: 12px;
            background: #6c757d;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>🔬 슬기로운 연구생활</h1>
            <p>연구원 생활의 고민을 풀어드려요</p>
            <span class="n2b-badge">가설검정기반 논리구조 N2B</span>
        </div>

        <!-- API 설정 화면 제거, 바로 시작 -->
        <div class="chat-area" id="chatArea"></div>

        <div class="quick-topics" id="quickTopics">
            <div class="quick-topics-label">💡 샘플질문들입니다. 클릭만으로 경험해보세요!</div>
            <div class="quick-topics-list">
                <button class="quick-topic" onclick="sendQuickTopic('논문이 안 써져요')">논문 작성</button>
                <button class="quick-topic" onclick="sendQuickTopic('과제 수주가 안 돼요')">과제 수주</button>
                <button class="quick-topic" onclick="sendQuickTopic('행정업무가 너무 많아요')">행정업무</button>
                <button class="quick-topic" onclick="sendQuickTopic('주간보고서 작성을 도와주세요')">주간보고</button>
                <button class="quick-topic" onclick="sendQuickTopic('연구 방향이 맞는지 모르겠습니다')">연구 방향</button>
                <button class="quick-topic" onclick="sendQuickTopic('승진이나 급여 문제로 고민입니다')">승진급여</button>
                <button class="quick-topic" onclick="sendQuickTopic('업무가 힘들어요')">업무고민</button>
                <button class="quick-topic" onclick="sendQuickTopic('부서 전략이 어려워요')">부서전략</button>
                <button class="quick-topic" onclick="sendQuickTopic('상사와 부딪쳐요')">상사관계</button>
            </div>
        </div>

        <div class="input-area" id="inputArea">
            <div id="attachedFileArea"></div>
            <div class="input-wrapper">
                <button class="attach-btn" onclick="document.getElementById('fileInput').click()">+</button>
                <input type="file" id="fileInput" class="file-input" accept=".txt,.pdf,.doc,.docx,.hwp" onchange="handleFileSelect(event)">
                <input type="text" class="input-field" id="userInput" placeholder="연구 고민을 편하게 말씀해주세요..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
            <div style="text-align: center; margin-top: 8px; font-size: 11px; color: #888;">
                오늘 <span id="usageCount">0</span>/100회 사용 · + 파일 첨부 가능
            </div>
        </div>
    </div>

    <script>
        // API 키 내장
        // 백엔드 API URL
        const API_URL = 'https://wise-research-life-api.onrender.com';
        const DAILY_LIMIT = 100;
        
        let messages = [];
        let isLoading = false;
        let currentDepth = 0;
        let lastN2BAnalysis = null;
        let originalProblem = '';

        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const usageCountEl = document.getElementById('usageCount');
        const attachedFileArea = document.getElementById('attachedFileArea');

        let attachedFile = null;
        let attachedFileContent = null;

        // 일일 사용량 관리
        function getTodayKey() {
            return 'wise-research-' + new Date().toISOString().split('T')[0];
        }

        function getUsageCount() {
            return parseInt(localStorage.getItem(getTodayKey()) || '0');
        }

        function incrementUsage() {
            const count = getUsageCount() + 1;
            localStorage.setItem(getTodayKey(), count.toString());
            usageCountEl.textContent = count;
            return count;
        }

        function canUse() {
            return getUsageCount() < DAILY_LIMIT;
        }

        // 초기화
        function init() {
            usageCountEl.textContent = getUsageCount();
            addAssistantMessage("안녕하세요! 😊\n\n연구고민, 업무고민 N2B로 정리해드려요.\n생각이 명확해져요.\n\n💬 논문이 안 써집니다 → 원인 분석\n🔍 OO 분야 과제를 찾고 있습니다 → 공고문 검색\n📚 OO 관련 참고문헌이 필요합니다 → 논문 검색\n📝 주간보고서 작성을 도와주세요 → 보고서 작성\n📓 연구노트를 정리해주세요 → 노트 정리\n📄 논문 초록을 작성해주세요 → 초록 작성\n📋 연구제안서를 검토해주세요 → 제안서 피드백\n🔬 연구심의를 도와주세요 → 심의 방법제안\n🤝 공동연구자와 갈등이 있습니다 → 관계 분석\n📊 연구 방향이 맞는지 모르겠습니다 → 방향 점검\n😔 연구가 의미있는지 모르겠습니다 → 동기 탐색\n\n모든 고민을 말씀해보세요!\n능동지원형 앱이라 메뉴가 따로 없습니다.\n+ 버튼으로 파일 첨부도 가능합니다.");
        }

        init();

        // 파일 처리
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            attachedFile = file;
            
            // 파일 읽기
            const reader = new FileReader();
            reader.onload = function(e) {
                if (file.type === 'application/pdf') {
                    // PDF는 base64로 저장
                    attachedFileContent = {
                        type: 'pdf',
                        data: e.target.result.split(',')[1]
                    };
                } else {
                    // 텍스트 파일
                    attachedFileContent = {
                        type: 'text',
                        data: e.target.result
                    };
                }
                showAttachedFile(file.name);
            };

            if (file.type === 'application/pdf') {
                reader.readAsDataURL(file);
            } else {
                reader.readAsText(file);
            }
        }

        function showAttachedFile(fileName) {
            attachedFileArea.innerHTML = `
                <div class="attached-file">
                    <span>📄 ${fileName}</span>
                    <span class="remove-file" onclick="removeFile()">✕</span>
                </div>
            `;
        }

        function removeFile() {
            attachedFile = null;
            attachedFileContent = null;
            attachedFileArea.innerHTML = '';
            document.getElementById('fileInput').value = '';
        }

        // 데모 응답 (폴백용)
        const demoResponses = {
            default: {
                n2b: {
                    not: "단순히 상황이 힘든 것이",
                    but: "문제의 본질이 무엇인지 명확히 파악하지 못한 것이",
                    because: "연구자는 문제 해결에는 익숙하지만, 정작 자신의 문제는 객관적으로 보기 어렵기 때문입니다"
                },
                suggestion: "문제 해결을 위해서는 본질을 먼저 파악해야 합니다. 조금 더 구체적으로 말씀해주시면, N2B 분석으로 문제의 본질을 함께 찾아볼게요.",
                nextAction: "어떤 부분이 가장 힘드신가요?"
            },
            "논문": {
                n2b: {
                    not: "시간이 없는 것이",
                    but: "가설(N2B)이 없이 실험부터 한 것이",
                    because: "코페르니쿠스도 먼저 '지구가 중심이 아니라 태양이 중심이다'라는 가설을 세우고 관측으로 증명했습니다. 실험 결과를 모아놓고 결론을 찾으면 논문이 안 써집니다"
                },
                suggestion: "논문을 쓰기 위해서는 가설(N2B)을 먼저 세워야 합니다. 'A가 아니라 B일 것이다'라는 가설을 한 문장으로 써보세요.",
                nextAction: "관련 선행연구를 찾아드릴까요?"
            },
            "과제": {
                n2b: {
                    not: "경쟁이 심한 것이",
                    but: "차별점이 불명확한 것이",
                    because: "평가자는 수십 개를 봅니다. '왜 이 팀이어야 하는지' 10초 안에 안 보이면 탈락입니다"
                },
                suggestion: "과제 선정을 위해서는 차별점을 명확히 해야 합니다. 제안서 첫 페이지에 '우리만 할 수 있는 이유' 3가지를 쓰세요.",
                nextAction: "관련 공고문을 찾아드릴까요?"
            },
            "공동연구": {
                n2b: {
                    not: "상대가 비협조적인 것이",
                    but: "역할 분담이 불명확한 것이",
                    because: "공동연구 갈등의 90%는 '누가 뭘 하기로 했는지' 문서화하지 않아서 생깁니다"
                },
                suggestion: "협업을 위해서는 역할 분담을 문서화해야 합니다. 지금 바로 '역할/기여/저자순서'를 이메일로 정리해서 공유하세요.",
                nextAction: "공동연구 협약서 양식을 드릴까요?"
            },
            "행정": {
                n2b: {

연구자의 고민을 듣고 N2B(NOT-BUT-BECAUSE) 프레임워크로 분석해주세요.

## N2B 프레임워크
- NOT (N): 문제가 ~이 아니라 (표면적/잘못된 원인 부정)
- BUT (B): ~이다 (진짜 원인 제시)
- BECAUSE (C): 왜냐하면 ~때문이다 (근거/논리적 설명)

## 핵심 원리
1. N2B는 비교판단입니다. 모든 판단은 비교판단이고, 논문의 결론도 비교판단입니다.

2. 가설이 먼저입니다. 
   - 먼저 N2B(가설)를 세우고 → 실험으로 증명
   - 실험해서 결론을 찾는 게 아니라, 가설을 세우고 실험으로 설명/증명하는 것
   - 코페르니쿠스: "지구가 중심이 아니라(N), 태양이 중심이다(B)" → 관측으로 증명

3. 논문 결론 = 비교판단 = N2B
   - "기존 연구는 A라고 했지만(NOT), 본 연구에서는 B임을 밝혔다(BUT), 왜냐하면 C이기 때문이다(BECAUSE)"

## 능동지원 원칙
분석만 하지 말고, 구체적인 행동을 제안하세요.
제안 형식: "[목표]를 위해서는 [행동]을 해야 합니다"

예시:
- 논문을 쓰기 위해서는 가설(N2B)을 먼저 세워야 합니다
- 과제 선정을 위해서는 차별점을 명확히 해야 합니다
- 협업을 위해서는 역할 분담을 문서화해야 합니다

그리고 다음 행동을 제안하세요:
- "관련 과제 찾아드릴까요?"
- "참고문헌 검색해드릴까요?"
- "초안 작성해드릴까요?"

## 연구 라이프사이클 (순환)
연구는 순환합니다:
과제 수주 → 연구 수행 → 논문 작성 → 과제 수주 → ...

한 단계가 끝나면 다음 단계를 제안하세요:
- 논문 완성 → "이 성과로 다음 과제 찾아드릴까요?"
- 과제 종료 → "후속 논문 작성 도와드릴까요?"
- 가설 수립 → "선행연구 찾아드릴까요?"

N2B도 순환합니다:
- 이번 연구의 결론(BUT)이 → 다음 연구의 가설(NOT)이 됩니다
- 끝이 아니라 새로운 시작입니다

이것이 능동지원의 핵심입니다. 항상 다음 단계를 제안하세요.

        }

        function addN2BResponse(response, depth) {
            const depthLabels = ['', '1차 분석', '2차 분석', '3차 분석', '4차 분석', '5차 분석'];
            const depthLabel = depthLabels[Math.min(depth, 5)] || `${depth}차 분석`;
            
            const isCore = response.isCore || false;
            const coreNeed = response.coreNeed || '';
            
            let bottomSection = '';
            if (isCore) {
                bottomSection = `
                    <div class="core-reached">
                        <div class="core-icon">🎯</div>
                        <div class="core-title">본질에 도달했습니다</div>
                        <div class="core-need">"${coreNeed}"</div>
                        <div class="core-message">
                            모든 고민의 뿌리에는 근본적인 욕구가 있습니다.<br>
                            이제 이 욕구를 건강하게 채우는 방법을 찾아보세요.
                        </div>
                    </div>
                    <button class="new-topic-btn" onclick="startNewTopic()">
                        💬 새로운 고민 이야기하기
                    </button>
                `;
            } else {
                bottomSection = `
                    <button class="deep-dive-btn" onclick="deepDive()">
                        🌊 더 깊이 분석하기 <span class="depth-indicator">${depth + 1}차로</span>
                    </button>
                `;
            }
            
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.innerHTML = `
                <div class="message-bubble">
                    <div class="n2b-analysis">
                        <div style="text-align: center; margin-bottom: 12px;">
                            <span class="depth-indicator">🔍 ${isCore ? '최종 분석' : depthLabel}</span>
                        </div>
                        <div class="n2b-item">
                            <div class="n2b-label not">❌ NOT (아니다)</div>
                            <div class="n2b-content">${escapeHtml(response.n2b.not)}</div>
                        </div>
                        <div class="n2b-item">
                            <div class="n2b-label but">✓ BUT (진짜는)</div>
                            <div class="n2b-content">${escapeHtml(response.n2b.but)}</div>
                        </div>
                        <div class="n2b-item">
                            <div class="n2b-label because">💡 BECAUSE (왜냐하면)</div>
                            <div class="n2b-content">${escapeHtml(response.n2b.because)}</div>
                        </div>
                    </div>
                    <div class="suggestion-box">
                        <div class="suggestion-title">🎯 이렇게 해보세요</div>
                        <div class="suggestion-content">${escapeHtml(response.suggestion)}</div>
                        ${response.nextAction ? `<div class="next-action">👉 ${escapeHtml(response.nextAction)}</div>` : ''}
                    </div>
                    ${bottomSection}
                </div>
            `;
            chatArea.appendChild(div);
            scrollToBottom();
        }

        function startNewTopic() {
            currentDepth = 0;
            lastN2BAnalysis = null;
            originalProblem = '';
            addAssistantMessage("새로운 고민이 있으시면 말씀해주세요! 😊\n\nN2B로 함께 풀어볼게요.");
            userInput.focus();
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatArea.appendChild(div);
            scrollToBottom();
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
